name: Build Nuvio Windows ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - Dev
      - main
    paths:
      - '.github/workflows/build-windows-arm64.yml'

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout NuvioDesktop source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21 (Windows ARM64)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          architecture: 'aarch64'
          cache: 'gradle'

      - name: Set up WiX Toolset v3 (required by jpackage for MSI)
        shell: pwsh
        run: |
          $wixDir = Join-Path $env:RUNNER_TEMP "wix314"
          New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
          $wixZip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $wixZip
          Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force
          echo "$wixDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Switch hardcoded Windows x64 targets to ARM64
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "*.gradle.kts" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match "windows-x64") {
              Write-Host "Updating windows-x64 -> windows-arm64 in $($_.FullName)"
              $content = $content -replace "windows-x64", "windows-arm64"
              Set-Content -Path $_.FullName -Value $content -Encoding UTF8
            }
          }

      - name: Package Windows ARM64 MSI Installer
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseMsi --rerun-tasks

      - name: Upload Windows ARM64 MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Windows-arm64-msi
          path: composeApp/build/compose/binaries/**/*.msi
