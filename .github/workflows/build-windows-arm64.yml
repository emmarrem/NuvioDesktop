I cannot directly compile and hand over a finished .msi binary file from here because Compose Multiplatform's native distribution packager (jpackage) does not support cross-compilation—it must run inside an active Windows ARM64 environment with internet access to fetch Gradle dependencies and the Windows WiX Toolset.

To make this as easy as possible without requiring you to write code from scratch, I have put together two automated ways to generate the native Windows ARM64 .msi installer from the NuvioMedia/NuvioDesktop source code: a cloud build using GitHub's free ARM64 servers (zero local setup) and a one-click PowerShell script for your Windows ARM64 PC.
Option 1: Build It in the Cloud on GitHub (No Local Setup Needed)

GitHub provides free windows-11-arm cloud runners that will compile the installer for you in the browser:

    Fork the repository: Open NuvioMedia/NuvioDesktop, sign in to your GitHub account, and click Fork in the top-right corner.

    Add the workflow file: In your forked repository, click Add file → Create new file, type .github/workflows/build-windows-arm64.yml as the file name, and paste the configuration below:

YAML

name: Build Nuvio Windows ARM64

on:
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout NuvioDesktop source
        uses: actions/checkout@v4
        with:
          ref: Dev

      - name: Set up JDK 21 (Windows ARM64)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          architecture: 'aarch64'
          cache: 'gradle'

      - name: Install WiX Toolset v3 (required by jpackage for MSI)
         shell: pwsh
        run: |
          winget install --id WiXToolset.WiXToolset --exact --silent --accept-package-agreements --accept-source-agreements
          echo "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Switch hardcoded Windows x64 targets to ARM64
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "*.gradle.kts" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match "windows-x64") {
              $content = $content -replace "windows-x64", "windows-arm64"
              Set-Content -Path $_.FullName -Value $content -Encoding UTF8
            }
          }

      - name: Package Windows ARM64 MSI Installer
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseMsi --rerun-tasks

      - name: Upload Windows ARM64 MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Windows-arm64-msi
          path: composeApp/build/compose/binaries/**/*.msi

    Run the build: Click Commit changes, navigate to the Actions tab in your forked repository, select Build Nuvio Windows ARM64 on the left, and click Run workflow.

    Download your installer: Once the job finishes (around 5–8 minutes), scroll to the Artifacts section at the bottom of the workflow run page and download Nuvio-Windows-arm64-msi.

Option 2: Automated Local Build Script for Your Windows ARM64 PC

If you prefer to compile the app directly on your Windows 11 ARM64 device, this script automates the entire process—installing Git, the Eclipse Temurin ARM64 JDK, and the WiX Toolset, cloning the Dev branch described in the NuvioDesktop README, patching windows-x64 references to windows-arm64 (Compose Multiplatform Compatibility), and packaging the .msi:

    Save the script: Open Notepad, paste the script below, and save it as build_nuvio_arm64.ps1 in a new folder (for example, C:\NuvioBuild\build_nuvio_arm64.ps1).

PowerShell

# ==============================================================================
# NuvioDesktop — Automated Native Windows ARM64 Builder (build_nuvio_arm64.ps1)
# ==============================================================================

$ErrorActionPreference = "Stop"

Write-Host "=== NuvioDesktop Windows ARM64 Build Assistant ===" -ForegroundColor Cyan

function Ensure-Command($cmd, $wingetId, $name) {
    if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) {
        Write-Host "[1/5] Installing $name via winget..." -ForegroundColor Yellow
        winget install --id $wingetId --exact --silent --accept-package-agreements --accept-source-agreements
    } else {
        Write-Host "[OK] $name is already installed." -ForegroundColor Green
    }
}

Ensure-Command "git" "Git.Git" "Git for Windows"
Ensure-Command "java" "EclipseAdoptium.Temurin.21.JDK" "Eclipse Temurin JDK 21 (ARM64)"

# Ensure WiX Toolset v3 is on PATH (required by jpackage to create .msi files)
$wixPath = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
if (-not (Get-Command "candle.exe" -ErrorAction SilentlyContinue)) {
    if (-not (Test-Path $wixPath)) {
        Write-Host "[1/5] Installing WiX Toolset v3.14..." -ForegroundColor Yellow
        winget install --id WiXToolset.WiXToolset --exact --silent --accept-package-agreements --accept-source-agreements
    }
    if (Test-Path $wixPath) {
        $env:Path += ";$wixPath"
    }
}

# Set JAVA_HOME to the ARM64 Temurin JDK if not already set
if (-not $env:JAVA_HOME) {
    $temurinDirs = Get-ChildItem "C:\Program Files\Eclipse Adoptium\" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending
    if ($temurinDirs) {
        $env:JAVA_HOME = $temurinDirs[0].FullName
        $env:Path = "$env:JAVA_HOME\bin;$env:Path"
    }
}

# Clone or update the NuvioDesktop repository (Dev branch)
$repoUrl = "https://github.com/NuvioMedia/NuvioDesktop.git"
$repoDir = Join-Path $PSScriptRoot "NuvioDesktop"

if (-not (Test-Path $repoDir)) {
    Write-Host "`n[2/5] Cloning NuvioDesktop repository..." -ForegroundColor Cyan
    git clone --branch Dev $repoUrl$repoDir
} else {
    Write-Host "`n[2/5] Updating existing NuvioDesktop clone..." -ForegroundColor Cyan
    Push-Location $repoDir
    git pull origin Dev
    Pop-Location
}

Set-Location $repoDir

# Update hardcoded windows-x64 references to windows-arm64
Write-Host "`n[3/5] Checking Gradle files for Windows ARM64 target..." -ForegroundColor Cyan
Get-ChildItem -Recurse -Filter "*.gradle.kts" | ForEach-Object {
    $content = Get-Content$_.FullName -Raw
    if ($content -match "windows-x64") {
        Write-Host "Updating 'windows-x64' -> 'windows-arm64' in $($_.Name)" -ForegroundColor Yellow
        $content =$content -replace "windows-x64", "windows-arm64"
        Set-Content -Path $_.FullName -Value$content -Encoding UTF8
    }
}

# Run the Gradle MSI packager
Write-Host "`n[4/5] Building NuvioDesktop Windows ARM64 MSI installer..." -ForegroundColor Cyan
.\gradlew.bat :composeApp:packageReleaseMsi --rerun-tasks

# Open output folder
$msiOutputDir = Join-Path $repoDir "composeApp\build\compose\binaries"
Write-Host "`n[5/5] Build Complete!" -ForegroundColor Green
if (Test-Path $msiOutputDir) {
    Get-ChildItem -Path $msiOutputDir -Recurse -Filter "*.msi" | ForEach-Object {
        Write-Host "Created installer: $($_.FullName)" -ForegroundColor Green
    }
    Invoke-Item $msiOutputDir
}

    Run the script: Right-click the Start button, open Terminal (Admin) or PowerShell (Admin), and run:
    PowerShell

    cd C:\NuvioBuild
    Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
    .\build_nuvio_arm64.ps1

Important Head-Up About Media Playback on Native ARM64

    UI vs. Embedded Video Player DLLs: The Nuvio interface and Kotlin code run natively on ARM64 through the ARM64 JVM and JetBrains Skiko (windows-arm64). However, Nuvio includes a custom media module (compose-media-player/mediaplayer in settings.gradle.kts) that wraps native C/C++ video libraries (like MPV or LibVLC).

    How to handle playback if the internal player fails: An ARM64 Java process cannot load an x64 .dll file directly. If the built-in video player shows a black screen or throws a native library error on your ARM64 build, open Settings → Player inside Nuvio and select an External Player (such as the native ARM64 version of VLC or MPV), or swap the bundled libmpv-2.dll with an aarch64 Windows build before packaging.


