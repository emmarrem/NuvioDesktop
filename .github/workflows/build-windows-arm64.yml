It is great that you are diving into coding, and wanting to build or port software for your hardware is a fantastic way to learn.

However, you do not need—and should not use—morluto/rea for this task. Here is why that is, along with the actual steps to get an ARM64 version running.
Why REA Isn’t the Right Tool

    Reverse engineering is for closed software: Tools like morluto/rea ("Reverse Engineer Anything") use AI agents to decompile closed binaries or inspect network traffic when you do not have access to the original source code. Because NuvioDesktop is open source, its full code is already available to inspect, edit, and compile directly.

    Decompilers do not cross-compile: Decompilation tools do not automatically transform compiled x64 machine code into native ARM64 instructions. Porting software across CPU architectures is handled by a compiler targeting your platform, not by reverse-engineering existing builds.

Option 1: The Quick Practical Solution (No Coding Needed)

If your primary goal is to use Nuvio on a Windows on ARM device (such as a Snapdragon X Elite or Surface Pro):

    Run the official x64 build via emulation: Windows 11 on ARM includes Microsoft's built-in Prism emulator. You can download the standard Windows installer from NuvioDesktop Releases and run it directly. Windows translates the x64 binary to ARM64 in real time with minimal performance overhead.

Option 2: Building a Native ARM64 App from Source

If you want to learn the developer workflow and attempt a native build, NuvioDesktop is built using Compose Multiplatform and Kotlin targeting the Java Virtual Machine (JVM).

    Install Git and a Windows ARM64 JDK:

        Download and install Git for Windows to manage repositories.

        Install a native Windows ARM64 Java Development Kit (JDK 17 or 21), such as Eclipse Temurin.

    Clone the repository:

        Open your Windows Terminal or PowerShell and clone the source code:
        Bash

        git clone https://github.com/NuvioMedia/NuvioDesktop.git
        cd NuvioDesktop

    Inspect native dependencies:

        The primary hurdle for ARM64 ports in media players is native libraries (.dll files) for video rendering and audio decoding (such as LibVLC or MPV).

        Check build.gradle.kts and settings.gradle.kts to verify whether the media dependencies provide pre-compiled windows-arm64 binaries alongside standard windows-x64 binaries. If a native media dependency only packages x64 DLLs, Gradle will throw an unresolved dependency error during the build.

    Run or package the desktop target:

        Test running the app locally using the Gradle wrapper:
        PowerShell

        .\gradlew.bat :composeApp:run

        Package an installer bundle once local execution succeeds:
        PowerShell

        .\gradlew.bat :composeApp:packageReleaseMsi --rerun-tasks

    Engage with the project maintainers:

        If you run into missing native bindings or build configuration issues, search or open a discussion thread on the NuvioDesktop GitHub Issues page. The maintainers can confirm which underlying media components currently block or support official Windows ARM64 distribution targets.

