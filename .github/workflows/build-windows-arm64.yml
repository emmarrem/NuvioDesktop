name: Build Nuvio Windows ARM64

on:
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout NuvioDesktop source
        uses: actions/checkout@v4
        with:
          ref: Dev

      - name: Set up JDK 21 (Windows ARM64)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          architecture: 'aarch64'
          cache: 'gradle'

      - name: Install WiX Toolset v3 (required by jpackage for MSI)
         shell: pwsh
        run: |
          winget install --id WiXToolset.WiXToolset --exact --silent --accept-package-agreements --accept-source-agreements
          echo "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Switch hardcoded Windows x64 targets to ARM64
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "*.gradle.kts" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match "windows-x64") {
              $content = $content -replace "windows-x64", "windows-arm64"
              Set-Content -Path $_.FullName -Value $content -Encoding UTF8
            }
          }

      - name: Package Windows ARM64 MSI Installer
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseMsi --rerun-tasks

      - name: Upload Windows ARM64 MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Windows-arm64-msi
          path: composeApp/build/compose/binaries/**/*.msi
