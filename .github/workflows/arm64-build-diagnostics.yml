name: ARM64 build diagnostic
on:
  push:
    paths:
      - .github/workflows/arm64-build-diagnostics.yml
permissions:
  contents: read
  actions: read
jobs:
  tail:
    runs-on: windows-11-arm
    steps:
      - name: Read failed native build tail
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          Invoke-WebRequest "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/jobs/117197424443/logs" -Headers $headers -OutFile "$env:RUNNER_TEMP/native-build.log"
          Get-Content "$env:RUNNER_TEMP/native-build.log" -Tail 180
